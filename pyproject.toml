[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-rag"
version = "0.1.0"
description = "企业级 RAG 知识库 + Agent：文档解析 / 向量检索 / TRT-LLM 推理 / 工具调用 / FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
company_rag = ["web/*.html"]
